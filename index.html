<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>박지영의 마을 — RPG 포트폴리오</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/sunn-us/SUITE/fonts/static/woff2/SUITE.css');

  :root {
    --sky: #BFE0C8;
    --ink: #22301F;
    --accent: #2F6B45;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'SUITE', sans-serif;
    background: linear-gradient(#CDE7D2, #BFE0C8 60%, #B3D9BE);
    color: var(--ink);
    touch-action: none;
  }

  #game { display: block; width: 100vw; height: 100vh; }

  /* ---------- HUD ---------- */
  .hud-top {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    pointer-events: none;
  }
  .hud-title {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.02em;
    background: rgba(255,255,255,0.82);
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid rgba(34,48,31,0.12);
  }
  .hud-title small { font-weight: 400; color: #5C6657; margin-left: 6px; }
  .to-text {
    pointer-events: auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 999px;
    background: #fff;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    font-family: inherit;
    font-weight: 700;
    font-size: 12.5px;
    text-decoration: none;
  }
  .to-text:hover { background: var(--accent); color: #fff; }
  .hud-right {
    display: flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
  }
  .hud-chip {
    font-weight: 800;
    font-size: 12.5px;
    background: rgba(255,255,255,0.86);
    padding: 8px 13px;
    border-radius: 999px;
    border: 1px solid rgba(34,48,31,0.14);
  }
  #like-btn {
    font-family: inherit;
    font-weight: 800;
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1.5px solid #D6536D;
    background: #fff;
    color: #D6536D;
    cursor: pointer;
    transition: transform .1s;
  }
  #like-btn:active { transform: scale(1.12); }

  .heart-fx {
    position: fixed;
    z-index: 60;
    font-size: 20px;
    pointer-events: none;
    animation: heartUp 1s ease-out forwards;
    opacity: 0;
  }
  @keyframes heartUp {
    0%   { transform: translateY(0) scale(0.5); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translateY(-100px) scale(1.35); opacity: 0; }
  }

  /* ---------- GAME CLEAR ---------- */
  #clear {
    position: fixed;
    inset: 0;
    background: rgba(20, 30, 22, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  #clear.open { display: flex; }
  .clear-card {
    background: #FBF6E8;
    border: 3px solid #7A5C3E;
    border-radius: 18px;
    padding: 34px 36px;
    text-align: center;
    max-width: 420px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.4), inset 0 0 0 2px rgba(255,255,255,0.5);
    animation: clearPop .45s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes clearPop {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .clear-emoji { font-size: 44px; animation: bob 1.2s ease-in-out infinite; }
  .clear-card h2 {
    font-weight: 800;
    font-size: 28px;
    letter-spacing: 0.02em;
    color: var(--accent);
    margin: 8px 0 10px;
  }
  .clear-card p { font-size: 14.5px; line-height: 1.7; margin-bottom: 20px; }
  .clear-btns { display: flex; flex-direction: column; gap: 8px; }
  .clear-btns button, .clear-btns a {
    font-family: inherit;
    font-weight: 700;
    font-size: 14px;
    padding: 11px;
    border-radius: 12px;
    border: 1.5px solid var(--accent);
    background: #fff;
    color: var(--accent);
    cursor: pointer;
    text-decoration: none;
  }
  .clear-btns button:hover, .clear-btns a:hover { background: var(--accent); color: #fff; }

  .hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: var(--ink);
    background: rgba(255,255,255,0.82);
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid rgba(34,48,31,0.12);
    white-space: nowrap;
  }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    color: var(--accent);
    background: rgba(255,255,255,0.6);
  }

  /* ---------- 터치 D-패드 (모바일에서만) ---------- */
  .dpad {
    position: fixed;
    right: 20px;
    bottom: 56px;
    display: none;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 52px);
    gap: 4px;
    opacity: 0.92;
  }
  .dpad button {
    border: none;
    border-radius: 12px;
    background: rgba(255,255,255,0.88);
    border: 1px solid rgba(34,48,31,0.16);
    font-size: 20px;
    color: var(--ink);
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .dpad button:active { background: var(--accent); color: #fff; }
  .dpad .u { grid-area: 1 / 2; }
  .dpad .l { grid-area: 2 / 1; }
  .dpad .r { grid-area: 2 / 3; }
  .dpad .d { grid-area: 3 / 2; }
  #action-btn {
    grid-area: 2 / 2;
    border-radius: 50%;
    font-weight: 800;
    font-size: 15px;
    background: rgba(255,255,255,0.5);
    color: rgba(34,48,31,0.35);
    transition: background .15s, color .15s;
  }
  #action-btn.show {
    background: var(--accent);
    color: #fff;
  }
  @media (pointer: coarse) {
    .dpad { display: grid; }
    .hint { display: none; }
  }

  /* ---------- NPC 대화창 ---------- */
  #dialog {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 14px;
    width: min(680px, calc(100vw - 20px));
    z-index: 30;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  #dialog.open { display: flex; }

  #dlg-card {
    display: none;
    background: #FBF6E8;
    border: 2.5px solid #7A5C3E;
    border-radius: 12px;
    padding: 12px 14px;
    max-height: 38vh;
    overflow-y: auto;
    font-size: 12.5px;
    line-height: 1.6;
    box-shadow: 0 8px 28px rgba(0,0,0,0.28);
  }
  #dlg-card.show { display: block; }

  .dlg-box {
    position: relative;
    height: 112px;
    background: rgba(251, 246, 232, 0.97);
    border: 3px solid #7A5C3E;
    border-radius: 14px;
    padding: 12px 44px 12px 14px;
    display: flex;
    gap: 12px;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(0,0,0,0.28), inset 0 0 0 2px rgba(255,255,255,0.5);
    user-select: none;
    -webkit-user-select: none;
  }
  .dlg-portrait {
    width: 80px;
    height: 68px;
    flex-shrink: 0;
    border: 2px solid #7A5C3E;
    border-radius: 10px;
    background: #DCEBDD url('./images/game/character.png') no-repeat 0 -2px;
    image-rendering: pixelated;
  }
  .dlg-main { flex: 1; min-width: 0; }
  .dlg-name {
    font-weight: 800;
    font-size: 13px;
    color: #2F6B45;
    margin-bottom: 4px;
  }
  .dlg-name span {
    font-weight: 600;
    font-size: 12px;
    color: #8A8072;
    margin-left: 6px;
  }
  #dlg-text {
    font-size: 13.5px;
    line-height: 1.6;
    height: 64px;
    overflow-y: auto;
    letter-spacing: -0.01em;
  }
  #dlg-next {
    position: absolute;
    right: 14px;
    bottom: 10px;
    font-size: 13px;
    color: #7A5C3E;
    animation: bob 0.9s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  #dlg-choices {
    display: flex;
    gap: 6px;
    min-height: 42px;
    align-items: center;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding: 2px;
    scrollbar-width: none;
  }
  #dlg-choices::-webkit-scrollbar { display: none; }
  #dlg-choices { cursor: grab; }
  #dlg-choices:active { cursor: grabbing; }
  #dlg-choices button { white-space: nowrap; flex-shrink: 0; }
  #dlg-choices button {
    font-family: inherit;
    font-weight: 700;
    font-size: 12.5px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1.5px solid #2F6B45;
    background: #fff;
    color: #2F6B45;
    cursor: pointer;
  }
  #dlg-choices button:hover { background: #2F6B45; color: #fff; }
  #dlg-close {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 26px;
    height: 26px;
    border: none;
    border-radius: 7px;
    background: rgba(122,92,62,0.16);
    color: #7A5C3E;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .p-cap { font-size: 12px; color: #8A8072; margin: 2px 0 6px; }

  /* 대화 카드 내부 콘텐츠 */

  .p-hero { font-size: 16px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px; }
  .p-meta { font-size: 13px; color: #6B6152; margin-bottom: 10px; }
  .p-sub { font-weight: 800; font-size: 14.5px; margin: 16px 0 8px; color: #2F6B45; }
  .p-p { margin-bottom: 10px; }
  .p-list { list-style: none; margin-bottom: 6px; }
  .p-list li { padding: 7px 0; border-top: 1px solid rgba(122,92,62,0.18); display: flex; gap: 8px; flex-wrap: wrap; }
  .p-list li:first-child { border-top: none; }
  .p-list b { font-weight: 800; flex-shrink: 0; }
  .p-list span { color: #6B6152; flex: 1; min-width: 160px; }
  .p-list a { color: #2F6B45; font-weight: 700; }
  .p-insight { margin-top: 10px; padding: 10px 12px; background: rgba(47,107,69,0.1); border-radius: 8px; font-size: 13.5px; }
  .p-stat { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .p-stat span { width: 96px; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .p-stat i { flex: 1; height: 9px; background: rgba(122,92,62,0.2); border-radius: 999px; overflow: hidden; display: block; }
  .p-stat b { display: block; height: 100%; background: #2F6B45; border-radius: 999px; }
  .p-badges { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .p-badge { border: 1px solid rgba(122,92,62,0.25); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; background: rgba(255,255,255,0.55); }
  .p-badge b { display: block; font-weight: 800; }
  .p-badge span { color: #6B6152; }
  .p-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .p-tags em { font-style: normal; font-size: 11.5px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: rgba(201,138,45,0.16); color: #A06E20; }
  .p-img { display: block; width: 100%; border-radius: 8px; border: 1px solid rgba(122,92,62,0.25); margin: 8px 0; }
  .p-hr { border: none; border-top: 1.5px dashed rgba(122,92,62,0.3); margin: 16px 0; }
  .p-draft { font-size: 10.5px; font-weight: 800; padding: 2px 6px; border-radius: 5px; background: #FDECEC; color: #C0392B; vertical-align: middle; }
  @media (max-width: 460px) { .p-badges { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud-top">
  <div class="hud-title">박지영의 마을 <small>v2 — 마을에 오신 걸 환영해요!</small></div>
  <div class="hud-right">
    <button class="hud-chip" id="sound-btn" aria-label="사운드 켜기/끄기" style="cursor:pointer;border:1px solid rgba(34,48,31,0.14);font-family:inherit;">🔊</button>
    <span class="hud-chip" id="progress"></span>
    <button id="like-btn" aria-label="좋아요">💚 <span id="like-count">0</span></button>
    <a class="to-text" href="./text.html">📄 문서로 보기</a>
  </div>
</div>

<div class="hint">방향키 / WASD 이동 · 문 앞에서 Space 입장</div>

<div class="dpad">
  <button class="u" data-dir="up" aria-label="위로">▲</button>
  <button class="l" data-dir="left" aria-label="왼쪽">◀</button>
  <button class="r" data-dir="right" aria-label="오른쪽">▶</button>
  <button class="d" data-dir="down" aria-label="아래로">▼</button>
  <button id="action-btn" aria-label="들어가기">A</button>
</div>

<div id="dialog">
  <div id="dlg-card"></div>
  <div id="dlg-choices"></div>
  <div class="dlg-box">
    <div class="dlg-portrait" aria-hidden="true"></div>
    <div class="dlg-main">
      <div class="dlg-name">지영 <span id="dlg-building"></span></div>
      <div id="dlg-text"></div>
    </div>
    <div id="dlg-next">▼</div>
    <button id="dlg-close" aria-label="대화 닫기">✕</button>
  </div>
</div>

<div id="clear">
  <div class="clear-card">
    <div class="clear-emoji">🎉</div>
    <h2>GAME CLEAR!</h2>
    <p>마을의 일곱 장소를 모두 둘러보셨어요.<br/>제 이야기를 끝까지 들어주셔서 정말 고마워요 💚</p>
    <div class="clear-btns">
      <button id="clear-like">💚 좋아요 남기기</button>
      <a href="./text.html" target="_blank" rel="noopener">📄 문서로 보기</a>
      <button id="clear-continue">🌳 계속 둘러보기</button>
    </div>
  </div>
</div>

<div id="loading">마을을 불러오는 중...</div>

<script src="./assets/js/data.js"></script>
<script src="./assets/js/game.js"></script>
</body>
</html>
